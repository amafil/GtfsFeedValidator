name: Release Build and Deploy

on:
  push:
    tags:
      - 'v*.*.*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Determine version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION}"
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./GtfsFeedValidator
      
    - name: Build solution
      run: dotnet build --configuration Release --no-restore --verbosity normal
      working-directory: ./GtfsFeedValidator
      
    - name: Run tests
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger trx \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults \
          ../GtfsFeedValidator.Test/GtfsFeedValidator.Test.csproj
      working-directory: ./GtfsFeedValidator
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results-release-${{ steps.version.outputs.version }}
        path: ./GtfsFeedValidator/TestResults
        retention-days: 90

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: validate-and-test
    strategy:
      matrix:
        runtime: ['linux-x64', 'win-x64', 'osx-x64', 'linux-arm64']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Download GTFS Validator JAR
      run: |
        mkdir -p ./GtfsFeedValidator
        curl -L -o ./GtfsFeedValidator/gtfs-validator.5.0.1-cli.jar \
          https://github.com/MobilityData/gtfs-validator/releases/download/v5.0.1/gtfs-validator-5.0.1-cli.jar
          
    - name: Publish self-contained application
      run: |
        dotnet publish ./GtfsFeedValidator/GtfsFeedValidator.csproj \
          --configuration Release \
          --runtime ${{ matrix.runtime }} \
          --self-contained true \
          --output ./publish/${{ matrix.runtime }} \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:Version="${{ needs.validate-and-test.outputs.version }}" \
          -p:AssemblyVersion="${{ needs.validate-and-test.outputs.version }}" \
          -p:FileVersion="${{ needs.validate-and-test.outputs.version }}"
          
    - name: Create release archive
      run: |
        cd ./publish/${{ matrix.runtime }}
        if [[ "${{ matrix.runtime }}" == *"win"* ]]; then
          zip -r ../../gtfs-feed-validator-${{ needs.validate-and-test.outputs.version }}-${{ matrix.runtime }}.zip .
        else
          tar -czf ../../gtfs-feed-validator-${{ needs.validate-and-test.outputs.version }}-${{ matrix.runtime }}.tar.gz .
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gtfs-feed-validator-${{ matrix.runtime }}
        path: |
          ./gtfs-feed-validator-${{ needs.validate-and-test.outputs.version }}-${{ matrix.runtime }}.*
        retention-days: 90

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: validate-and-test
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download GTFS Validator JAR
      run: |
        curl -L -o ./GtfsFeedValidator/gtfs-validator.5.0.1-cli.jar \
          https://github.com/MobilityData/gtfs-validator/releases/download/v5.0.1/gtfs-validator-5.0.1-cli.jar
          
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ needs.validate-and-test.outputs.version }}
          
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./GtfsFeedValidator
        file: ./GtfsFeedValidator/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-and-test, build-artifacts, build-docker]
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        pattern: gtfs-feed-validator-*
        merge-multiple: false
        
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from git commits since last tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [[ -n "$PREVIOUS_TAG" ]]; then
          CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --oneline --pretty=format:"- %s (%h)" | head -20)
        else
          CHANGELOG="Initial release"
        fi
        
        # Write changelog to file and output
        cat << 'EOF' > CHANGELOG.md
        ## What's Changed
        
        $CHANGELOG
        
        ## Docker Images
        
        - `ghcr.io/${{ github.repository }}:${{ needs.validate-and-test.outputs.version }}`
        - `ghcr.io/${{ github.repository }}:latest`
        
        ## Installation
        
        ### Docker
        ```bash
        docker pull ghcr.io/${{ github.repository }}:${{ needs.validate-and-test.outputs.version }}
        ```
        
        ### Binary Downloads
        Download the appropriate binary for your platform from the Assets section below.
        
        ## Prerequisites
        
        - Java Runtime Environment (JRE) 8 or later
        - GTFS Validator JAR (included in releases)
        
        **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ needs.validate-and-test.outputs.version }}
        EOF
        
        echo "changelog_file=CHANGELOG.md" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.validate-and-test.outputs.version }}
        name: Release ${{ needs.validate-and-test.outputs.version }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: ${{ contains(needs.validate-and-test.outputs.version, 'alpha') || contains(needs.validate-and-test.outputs.version, 'beta') || contains(needs.validate-and-test.outputs.version, 'rc') }}
        files: |
          ./artifacts/**/*.zip
          ./artifacts/**/*.tar.gz
        generate_release_notes: true
        
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate-and-test, build-docker]
    if: ${{ !contains(needs.validate-and-test.outputs.version, 'alpha') && !contains(needs.validate-and-test.outputs.version, 'beta') }}
    environment: staging
    
    steps:
    - name: Deploy to staging environment
      run: |
        echo "?? Deploying version ${{ needs.validate-and-test.outputs.version }} to staging..."
        echo "Docker image: ghcr.io/${{ github.repository }}:${{ needs.validate-and-test.outputs.version }}"
        # Add your staging deployment steps here
        # For example:
        # - Update Kubernetes manifests
        # - Deploy to Azure Container Apps
        # - Update Docker Compose files
        # - Trigger deployment webhook
        
    - name: Verify deployment
      run: |
        echo "? Staging deployment verification completed"
        # Add health checks and verification steps
        
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [validate-and-test, create-release]
    if: always()
    
    steps:
    - name: Notify Success
      if: ${{ needs.create-release.result == 'success' }}
      run: |
        echo "?? Release ${{ needs.validate-and-test.outputs.version }} completed successfully!"
        # Add notification logic here (Slack, Teams, email, etc.)
        
    - name: Notify Failure
      if: ${{ needs.create-release.result == 'failure' }}
      run: |
        echo "? Release ${{ needs.validate-and-test.outputs.version }} failed!"
        # Add failure notification logic here